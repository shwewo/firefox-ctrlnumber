name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build XPI
        run: (cd src && zip -X -r ../firefox-ctrlnumber.xpi .)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: firefox-ctrlnumber.xpi
          generate_release_notes: true
          fail_on_unmatched_files: true
